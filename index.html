<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador Transdata</title>
  <meta name="description" content="Portal de acesso aos sistemas e relatórios da Transdata">
  <meta name="theme-color" content="#4d1476">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Transdata">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button type="button" class="instalar-pc" id="instalar-pc" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Instalar app
  </button>
  <div class="instrucoes-pc" id="instrucoes-pc" hidden></div>

  <main class="portal">
    <header class="cabecalho">
      <img class="logo" src="assets/logo-transdata.png" alt="Transdata">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>
    <nav class="quadrantes" id="quadrantes" aria-label="Sistemas disponíveis"></nav>

    <section class="institucional" id="institucional" aria-label="Missão, Visão e Valores">
      <div class="inst-abas" id="inst-abas" role="tablist"></div>
      <div class="inst-palco" id="inst-palco" aria-live="polite"></div>
      <div class="inst-progresso"><span id="inst-barra"></span></div>
    </section>
  </main>
  <footer class="rodape">
    <button type="button" class="instalar" id="instalar" hidden>📲 Instalar app</button>
    <div class="instrucoes" id="instrucoes" hidden></div>
    <p class="copyright">&copy; <span id="ano"></span> Transdata</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
