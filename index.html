<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diretoria de Negócios</title>
  <meta name="description" content="Portal de acesso aos sistemas e relatórios da Transdata">
  <meta name="theme-color" content="#4d1476">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Transdata">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Login: decide já na abertura se mostra a tela de acesso ou os sistemas, para não piscar.
    // A sessão do Supabase fica guardada nesta chave (projeto emzqlctomlsjwmgthbkv); acesso.js confirma depois.
    // Link de redefinir senha (#...type=recovery) sempre abre a tela de acesso.
    (function () {
      var url = location.hash + location.search;
      var temSessao = false;
      try { temSessao = !!localStorage.getItem("sb-emzqlctomlsjwmgthbkv-auth-token"); } catch (e) {}
      if (/access_token=|[?&]code=/.test(url)) temSessao = true; // link de confirmação do cadastro: vai entrar
      if (/type=recovery/.test(url)) temSessao = false;          // link de redefinir senha: tela de acesso
      if (/[?&]token_hash=/.test(url)) temSessao = false;        // link dos e-mails: tela do botão
      document.documentElement.classList.add(temSessao ? "com-sessao" : "sem-sessao");
    })();
  </script>
  <script>
    // Abertura animada: uma vez por visita e nunca para quem pediu menos movimento.
    // A classe esconde a tela até cidade.js começar; a reserva mostra tudo se ele não rodar.
    (function () {
      try { if (sessionStorage.getItem("transdata-abertura")) return; } catch (e) {}
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var raiz = document.documentElement;
      raiz.classList.add("abertura");
      window.__aberturaReserva = setTimeout(function () {
        raiz.classList.remove("abertura", "abertura-roda");
      }, 7000);
    })();
  </script>
</head>
<body>
  <button type="button" class="instalar-pc" id="instalar-pc" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Instalar app
  </button>
  <div class="instrucoes-pc" id="instrucoes-pc" hidden></div>

  <!-- Tela de acesso: aparece para quem não entrou. É o único login dos sistemas (CS Flow, Transmobile, Roadmap). -->
  <main class="acesso" id="acesso" aria-labelledby="acesso-titulo">
    <div class="acesso-marca">
      <img class="logo" src="assets/logo-transdata.png" alt="Transdata">
      <h1 id="acesso-marca-titulo">Diretoria de Negócios</h1>
      <div class="acesso-visao" id="acesso-institucional" aria-live="off">
        <div class="acesso-institucional-cabecalho">
          <span class="acesso-visao-titulo" id="acesso-visao-titulo"></span>
          <span class="acesso-institucional-contador" id="acesso-institucional-contador" aria-hidden="true"></span>
        </div>
        <div class="acesso-visao-conteudo" id="acesso-visao-texto"></div>
        <div class="acesso-institucional-progresso" aria-hidden="true"><span id="acesso-institucional-progresso"></span></div>
      </div>
    </div>
    <section class="acesso-cartao" aria-live="polite">
      <img class="acesso-selo" src="assets/icon-192.png" alt="" width="64" height="64">
      <h2 id="acesso-titulo">Acessar sistemas</h2>
      <p class="acesso-sub" id="acesso-sub"></p>
      <div id="acesso-conteudo"></div>
    </section>
  </main>

  <main class="portal">
    <header class="cabecalho">
      <img class="logo" src="assets/logo-transdata.png" alt="Transdata">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>
    <nav class="quadrantes" id="quadrantes" aria-label="Sistemas disponíveis"></nav>

    <section class="institucional" id="institucional" aria-label="Missão, Visão e Valores">
      <div class="inst-abas" id="inst-abas" role="tablist"></div>
      <div class="inst-palco" id="inst-palco" aria-live="polite"></div>
      <div class="inst-progresso"><span id="inst-barra"></span></div>
    </section>
  </main>
  <footer class="rodape">
    <button type="button" class="instalar" id="instalar" hidden>📲 Instalar app</button>
    <div class="instrucoes" id="instrucoes" hidden></div>
    <p class="conta" id="conta" hidden></p>
    <p class="copyright">&copy; <span id="ano"></span> Transdata</p>
  </footer>

  <!-- Minha conta: trocar e-mail e senha; para os administradores do portal, convidar pessoas (conta.js) -->
  <dialog class="painel-conta" id="painel-conta" aria-labelledby="painel-conta-titulo">
    <div class="painel-conta-caixa">
      <div class="painel-conta-topo">
        <div>
          <h2 id="painel-conta-titulo">Minha conta</h2>
          <p class="painel-conta-quem" id="painel-conta-quem"></p>
        </div>
        <button type="button" class="painel-fechar" id="painel-conta-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="painel-conta-corpo" id="painel-conta-corpo"></div>
    </div>
  </dialog>

  <script src="vendor/supabase-2.119.1.js"></script>
  <script src="config.js"></script>
  <script src="acesso.js"></script>
  <script src="conta.js"></script>
  <script src="app.js"></script>
  <script src="cenas.js"></script>
  <script src="cidade.js"></script>
</body>
</html>
